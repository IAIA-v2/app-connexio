<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iaia Remot</title>
<meta name="theme-color" content="#f6fbf3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iaia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=JSON.parse(localStorage.getItem('iaia.theme'))||{},r=document.documentElement;if(t.seed)r.dataset.seed=t.seed;if(t.scheme&&t.scheme!=='system')r.dataset.scheme=t.scheme}catch(e){}</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
